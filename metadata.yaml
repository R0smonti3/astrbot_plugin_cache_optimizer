name: astrbot_plugin_cache_optimizer
display_name: 提高缓存命中 (CacheOptimizer)
short_desc: 阶梯式裁剪历史会话，提升 DeepSeek 等模型的提示词缓存命中率，降低调用成本与响应延迟
desc: >-
  专为支持前缀缓存（Prefix Cache）的大模型（如 DeepSeek、Kimi 等）设计。
  当发送给模型的历史上下文开头保持不变时，模型服务商会复用已有的缓存，输入计费大幅降低且响应更快。
  本插件通过以下机制帮助模型更稳定地复用缓存：
  1. 阶梯式历史裁剪：严格以合法的普通用户发言轮数进行计数，历史累计满 L + S 轮（当前轮为第 L + S + 1 轮）时集中裁剪至保留最近 L 轮，代替原生每轮滑动的淘汰机制；裁剪结果随正常流程持久化到数据库；
  2. 严格事务边界对齐：裁剪起点锁定在完整 User 消息边界，完整保留后续工具调用链路，杜绝孤立 Tool 消息导致接口 400 报错；
  3. 跨厂商账单监控与配置健康诊断：兼容 DeepSeek、OpenAI、Claude、Gemini 的 Prompt Cache 命中率统计，实时诊断原生框架配置冲突与高频动态时间戳击穿前缀风险；
  4. 支持分会话独立查看运行指标：支持 /cache_opt here 独立查看当前群聊统计。
help: 后台自动生效，无需特殊配置。管理员发送 /cache_opt 可查看全局统计，/cache_opt here 查看当前会话统计。
